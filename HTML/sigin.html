<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link href="../CSS/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <main class="container form-signin w-100 auto">
        <form>
            <div class="text-center mb-4">
              <h2 class="fw-bold">Bem Vindo(a)!😁</h2>
              <p class="text-secondary">
                Entre com a sua conta pra continuar 
              </p>
            </div>
            <div class="mb-3">
                <label for="exampleinputemail1" class="form-label">email de endereço</label>
                <input type="email" class="form-control" id="exampleinputemail" aria-describedby="emailhelp">
                <div id="emailhelp" class="form-text">Nunca compartilharemos seu e-mail com mais ninguém.</div>
            </div>
            <div class="mb-3">
                <label for="examplepassword1" class="form-label">senha</label>
                <input type="password" class="form-control" id="exampleinputpassword1">
            </div>
             <div class="mb-3">
                <label for="examplepassword1" class="form-label">Digite sua senha novamente</label>
                <input type="password" class="form-control" id="exampleinputpassword1">
            </div>
            <div class="mb-3" form-check-label>
                <label class="form-check-label" for="examplecheck1">Lembre de mim</label>
                <input type="checkbox" class="form-check-input" id="examplecheck1">
              
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </main>
    <script src="../JS/bootstrap.bundle.min.js"></script>
</body>
</html>
